<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You, My Love</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes heartbeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .heartbeat {
            animation: heartbeat 1.5s infinite;
        }

        .photo-container {
            transition: all 0.5s ease;
        }

        .photo-container:hover {
            transform: scale(1.1) rotate(5deg);
            z-index: 10;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        #romanticMessage {
            max-width: 100%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-height: 150px; 
            overflow: auto;
        }
        

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translate(0, 0px); }
            50% { transform: translate(0, 15px); }
            100% { transform: translate(0, 0px); }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-pink-200 to-pink-500 flex flex-col items-center justify-center min-h-screen p-10 text-white relative overflow-x-hidden">
    <div id="particles-js"></div>
    <div id="floatingHearts"></div>
    
    <div class="bg-white p-8 mt-10 shadow-xl text-center w-full max-w-md transition transform hover:scale-105 relative z-10">
        <div class="absolute -top-6 left-1/2 transform -translate-x-1/2">
            <span class="text-5xl heartbeat inline-block">💖</span>
        </div>
    
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-600">
            Hi My Love! 
        </h1>
    
        <div class="mt-6 relative">
            <p id="romanticMessage" class="text-gray-700 text-lg font-medium max-w-full break-words overflow-auto p-2">
                I have something for you...
            </p>
            <div id="typingIndicator" class="hidden">
                <span class="typing-dot">.</span>
                <span class="typing-dot">.</span>
                <span class="typing-dot">.</span>
            </div>
        </div>
    
        <button id="messageButton" onclick="changeMessage()" class="mt-6 bg-gradient-to-r from-pink-500 to-purple-600 text-white px-8 py-4 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-pink-300">
            <span class="flex items-center justify-center">
                <span class="mr-2">Click Me!</span>
                <span class="text-2xl">💌</span>
            </span>
        </button>
    </div>
    
    
    <div class="mt-8 grid grid-cols-2 gap-4 max-w-md">
        <div class="photo-container bg-white p-2 shadow-lg overflow-hidden">
            <img src="/img/berkesan.jpeg" alt="Photo 1" class=" w-full h-full object-cover">
        </div>
        
        <div class="photo-container bg-white p-2 shadow-lg overflow-hidden">
            <img src="/img/second_photobooth.jpeg" alt="Photo 2" class=" w-full h-full object-cover">
        </div>
        <div class="photo-container bg-white p-2 shadow-lg overflow-hidden">
            <img src="/img/ultah_cece.jpeg" alt="Photo 3" class=" w-full h-full object-cover">
        </div>
        <div class="photo-container bg-white p-2 shadow-lg overflow-hidden">
            <img src="/img/love.jpg" alt="Photo 4" class=" w-full h-full object-cover">
        </div>
        <div class="photo-container bg-white p-2 shadow-lg overflow-hidden">
            <img src="/img/lucu.jpeg" alt="Photo 4" class=" w-full h-full object-cover">
        </div>
        <div class="photo-container bg-white p-2 shadow-lg overflow-hidden">
            <img src="/img/webcam-toy-photo2.jpg" alt="Photo 4" class=" w-full h-full object-cover">
        </div>

        <div class="photo-container bg-white p-2 shadow-lg overflow-hidden">
            <img src="/img/photobooth2.jpg" alt="Photo 4" class=" w-full h-full object-cover">
        </div>
        <div class="photo-container bg-white p-2 shadow-lg overflow-hidden">
            <img src="/img/keluarga.jpeg" alt="Photo 4" class=" w-full h-full object-cover">
        </div>
        <div class="photo-container bg-white p-2 shadow-lg overflow-hidden">
            <img src="/img/anotherplace.jpeg" alt="Photo 4" class=" w-full h-full object-cover">
        </div>
        <div class="photo-container bg-white p-2 shadow-lg overflow-hidden">
            <img src="/img/2025.jpg" alt="Photo 4" class=" w-full h-full object-cover">
        </div>

    </div>
    
    <audio id="loveSong" src="./vid/Romantic.mp3" loop></audio>
    
    <button id="musicButton" onclick="toggleMusic()" class="fixed bottom-4 left-4 bg-gradient-to-r from-gray-200 to-gray-300 text-white px-3 py-3 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300 flex items-center">
        <span id="musicIcon" class="text-lg mr-2">🎵</span>
    </button>
    
    <div id="messageModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full text-center transform scale-95 transition-transform duration-300">
            <div class="text-6xl mb-4">💝</div>
            <h2 id="specialMessage" class="text-2xl font-bold text-pink-600 mb-4">For Cece, Love of My Life</h2>
            <p id="modalMessage" class="text-gray-700 text-lg mb-6">You are very special to me!</p>
            <button onclick="closeModal()" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-6 py-3 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:scale-105">Close</button>
            <button onclick="showSpecialMessage()" class="bg-gradient-to-r from-red-500 to-pink-600 text-white px-6 py-3 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-red-300">
                More Message
            </button>
        </div>
    </div>
    
    <div class="text-center w-full max-w-md mt-8">
        <button onclick="showSpecialMessage()" class="bg-gradient-to-r from-red-500 to-pink-600 text-white px-6 py-3 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-red-300">
            Special Message 💌
        </button>
    </div>
    
    <script>
        // Particle.js configuration
        document.addEventListener("DOMContentLoaded", function() {
            particlesJS("particles-js", {
                particles: {
                    number: { value: 50, density: { enable: true, value_area: 800 } },
                    color: { value: "#ff66b2" },
                    shape: { type: "heart", stroke: { width: 0, color: "#000000" } },
                    opacity: { value: 0.5, random: true },
                    size: { value: 15, random: true },
                    move: { enable: true, speed: 3, direction: "none", random: true, out_mode: "out" }
                }
            });
            
            createFloatingHearts();
            
            setTimeout(() => {
                typeMessage("I have something for you...");
            }, 1000);
        });
        const messages = [
            "Loving you is one of the most beautiful things in my life. ",
            "You are home for my heart, a place I always want to return to.",
            "You are where I feel safe, accepted, and loved in a way that can't be explained with words.",
            "When we were apart, I realized how big your influence is in my life.",
            "When we got back together on our anniversary, I promised myself not to let distance separate us again.",
            "I want us to keep moving forward together, facing whatever comes our way.",
            "Ce, maybe I'm not always good with words, but one thing that won't change, I want to be the person who makes you happy.",
        ];
        
        const specialMessages = [
            "To Cece, love of my life,\n\nOf all that has happened in my life, loving you is one of the most beautiful things. You are home for my heart, a place I always want to return to, where I feel safe, accepted, and loved in a way that can't be explained with words.",
            "I still remember when we were apart, and it made me realize how much space you fill in my life. When we got back together on our anniversary, I promised myself not to let distance or mistakes separate us again. I want us to keep moving forward together, facing whatever comes our way, with our hands always holding each other.",
            "Ce, I know I may not always be good with words or show my feelings perfectly, but one thing that won't change, I want to be the person who makes you happy. I want to see your beautiful smile every day, remind you how deeply you are loved, and always be someone you can rely on whenever you need me.",
            "I am so proud of you, for all that you have achieved, especially the scholarship you received. I know how hard you worked for it, and I will always be there to support your dreams, whatever they may be.\n\nThank you for choosing to stay with me, for believing in us. I will always love you,not just today, but tomorrow and for all the days to come.\n\nWith all my heart and love, Adnan"
        ];
        
        // Music toggle function
        function toggleMusic() {
            const song = document.getElementById("loveSong");
            const musicText = document.getElementById("musicText");
            const musicIcon = document.getElementById("musicIcon");
            const musicButton = document.getElementById("musicButton");
            
            if (song.paused) {
                song.play();
                musicText.innerText = "Pause Music";
                musicIcon.innerText = "🎶";
                musicButton.classList.add("animate-pulse");
            } else {
                song.pause();
                musicText.innerText = "Play Music";
                musicIcon.innerText = "🎵";
                musicButton.classList.remove("animate-pulse");
            }
            
            anime({
                targets: '#musicButton',
                scale: [1, 0.95, 1],
                duration: 300,
                easing: 'easeInOutQuad'
            });
        }
        
        function changeMessage() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            const randomMessage = messages[randomIndex];
            
            anime({
                targets: '#messageButton',
                scale: [1, 0.95, 1],
                duration: 300,
                easing: 'easeInOutQuad'
            });
            
            addFallingHearts();
        
            typeMessage(randomMessage);
        }
    
        function typeMessage(message) {
            const messageElement = document.getElementById("romanticMessage");
            const typingIndicator = document.getElementById("typingIndicator");
            
            messageElement.innerHTML = ""; 
            typingIndicator.classList.remove("hidden");
            
            setTimeout(() => {
                typingIndicator.classList.add("hidden");
                let i = 0;
                const typing = setInterval(() => {
                    if (i < message.length) {
                        messageElement.innerHTML += message.charAt(i) === " " ? "&nbsp;" : message.charAt(i);
                        i++;
                    } else {
                        clearInterval(typing);
                    }
                }, 50);
            }, 1000);
        }
        
        function createFloatingHearts() {
            const heartsContainer = document.getElementById("floatingHearts");
            const heartSymbols = ["💕", "💖", "💗", "💓", "💞"];
            
            for (let i = 0; i < 10; i++) {
                const heart = document.createElement("div");
                const randomHeart = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                
                heart.innerText = randomHeart;
                heart.className = "absolute text-3xl floating";
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = `${Math.random() * 100}%`;
                heart.style.opacity = "0.7";
                heart.style.animationDelay = `${Math.random() * 2}s`;
                heart.style.fontSize = `${Math.random() * 20 + 20}px`;
                heart.style.zIndex = "1";
                
                heartsContainer.appendChild(heart);
            }
        }
        
        function addFallingHearts() {
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const heart = document.createElement("div");
                    heart.innerText = "💖";
                    heart.className = "fixed text-3xl";
                    heart.style.left = `${Math.random() * 100}%`;
                    heart.style.top = "-20px";
                    heart.style.zIndex = "20";
                    document.body.appendChild(heart);

                    anime({
                        targets: heart,
                        translateY: window.innerHeight + 50,
                        translateX: anime.random(-100, 100),
                        rotate: anime.random(-45, 45),
                        opacity: [1, 0],
                        duration: anime.random(1500, 3000),
                        easing: 'easeInOutQuad',
                        complete: function() {
                            heart.remove();
                        }
                    });
                }, i * 300);
            }
        }
        
        function showSpecialMessage() {
            const randomIndex = Math.floor(Math.random() * specialMessages.length);
            const randomMessage = specialMessages[randomIndex];
            
            document.getElementById("modalMessage").innerText = randomMessage;
            const modal = document.getElementById("messageModal");
            
            modal.style.opacity = "1";
            modal.style.pointerEvents = "auto";
            
            const modalContent = modal.querySelector("div");
            modalContent.style.transform = "scale(1)";
            
            addFallingHearts();
        }
        
        // Close modal
        function closeModal() {
            const modal = document.getElementById("messageModal");
            const modalContent = modal.querySelector("div");
            
            modalContent.style.transform = "scale(0.95)";
            modal.style.opacity = "0";
            
            setTimeout(() => {
                modal.style.pointerEvents = "none";
            }, 300);
        }
    </script>
</body>
</html>
